<script>
    (() => {
        const gradientDuration = 20000;
        const elapsedSeconds = (Date.now() % gradientDuration) / 1000;
        document.documentElement.style.setProperty("--gradient-delay", `-${elapsedSeconds}s`);
    })();
</script>
