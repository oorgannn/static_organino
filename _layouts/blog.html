<!DOCTYPE html>
<html lang="{{ page.language | default: site.lang | default: 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include site-head.html %}
    <meta name="theme-color" content="#fffaf0">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="/assets/favicon-192x192.png" type="image/png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/assets/blog/blog.css">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="/blog/feed.xml">
</head>
<body class="blog-shell">
    {% include site-header.html active="blog" %}

    <div class="blog-frame">
        <aside class="blog-sidebar" aria-label="Blog navigation">
            <p class="blog-sidebar-label">journal</p>
            <nav>
                <a href="/blog/"{% if page.section == "all" %} aria-current="page"{% endif %}>All</a>
                <a href="/blog/italiano/"{% if page.section == "italiano" %} aria-current="page"{% endif %}>Italiano</a>
                <a href="/blog/english/"{% if page.section == "english" %} aria-current="page"{% endif %}>English</a>
                <a href="/blog/about/"{% if page.section == "about" %} aria-current="page"{% endif %}>About</a>
            </nav>
        </aside>

        <main class="blog-main">
            {{ content }}
        </main>
    </div>

    <footer class="blog-footer">
        <div class="footer-content">
            <div class="footer-brand">
                <h3>organ</h3>
                <p>no, i don't sell organs</p>
            </div>
            <div class="blog-footer-links" aria-label="Footer links">
                <a href="/blog/feed.xml">RSS</a>
                <a href="mailto:oorgannn@gmail.com">Email</a>
                <a href="https://www.instagram.com/0rg4n/" rel="me">Instagram</a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>© {{ "now" | date: "%Y" }} organ. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
